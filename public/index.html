<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NAS Core Demo</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="hero">
        <div class="hero-copy">
          <p class="eyebrow">NAS Core Demo</p>
          <h1>面向数据恢复、网络配置与虚拟机管理的核心框架样例</h1>
          <p class="hero-text">
            这个 demo 重点演示 NAS 核心模块的任务化执行、状态管理和前后端结构，不直接依赖真实硬件或第三方服务。
          </p>
        </div>
        <div class="hero-panel">
          <div class="panel-row">
            <span>服务地址</span>
            <strong>127.0.0.1:4000</strong>
          </div>
          <div class="panel-row">
            <span>运行模式</span>
            <strong>Zero Dependency</strong>
          </div>
          <div class="panel-row">
            <span>当前任务数</span>
            <strong id="hero-task-count">0</strong>
          </div>
        </div>
      </header>

      <section class="stats-grid" id="stats-grid"></section>

      <main class="main-grid">
        <section class="card">
          <div class="section-head">
            <div>
              <p class="section-kicker">Recovery</p>
              <h2>数据恢复</h2>
            </div>
            <button id="create-snapshot-btn">创建快照</button>
          </div>
          <div class="button-row">
            <button id="restore-file-btn" class="ghost">模拟文件恢复</button>
            <button id="rollback-volume-btn" class="ghost danger">模拟卷回滚</button>
          </div>
          <div id="snapshot-list" class="list-block"></div>
        </section>

        <section class="card">
          <div class="section-head">
            <div>
              <p class="section-kicker">Network</p>
              <h2>网络配置</h2>
            </div>
            <button id="apply-safe-network-btn">应用安全配置</button>
          </div>
          <div class="button-row">
            <button id="apply-risky-network-btn" class="ghost warning">模拟失败并回滚</button>
          </div>
          <div id="network-list" class="list-block"></div>
        </section>

        <section class="card">
          <div class="section-head">
            <div>
              <p class="section-kicker">Virtual Machine</p>
              <h2>虚拟机管理</h2>
            </div>
            <button id="create-vm-btn">创建 VM</button>
          </div>
          <div class="button-row">
            <button id="start-first-vm-btn" class="ghost">启动首台 VM</button>
            <button id="stop-first-vm-btn" class="ghost">停止首台 VM</button>
          </div>
          <div id="vm-list" class="list-block"></div>
        </section>
      </main>

      <section class="card task-card">
        <div class="section-head">
          <div>
            <p class="section-kicker">Task Center</p>
            <h2>任务中心</h2>
          </div>
        </div>
        <div id="task-list" class="task-list"></div>
      </section>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
